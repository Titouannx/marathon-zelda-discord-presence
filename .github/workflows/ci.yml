name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Verifie que le code compile sur les deux cibles publiees. Build natif sur
# chaque OS (comme la release) car systray depend de cgo sur macOS et ne peut
# donc pas etre cross-compile depuis Linux.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - run: go vet ./...
      - run: go build -ldflags "-X main.discordClientID=ci-placeholder" ./...

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - run: go vet ./...
      - run: go build -ldflags "-X main.discordClientID=ci-placeholder" ./...
